<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile Page | fdv.lol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self' https://www.dextools.io https://challenges.cloudflare.com https://giscus.app;" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FDV.lol - Token Profile" />
  <meta property="og:description" content="View token price, liquidity, momentum, pairs and more on Solana." />
  <meta property="og:image" content="https://build23w.github.io/fdv.lol/src/assets/images/fdv.lol.meta.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:image" content="https://build23w.github.io/fdv.lol/src/assets/images/fdv.lol.meta.png" />
  <link rel="icon" type="image/png" href="https://build23w.github.io/fdv.lol/src/assets/images/icons/fdv.lol.ico" />
  <link id="canonical-link" rel="canonical" href="https://build23w.github.io/fdv.lol/" />

  <style>
    :root { color-scheme: dark light; }
    html,body { height: 100%; margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { display: grid; place-items: center; background: #071117; color: #cfe8f1; }
    .wrap { text-align: center; padding: 24px; max-width: 640px; }
    .muted { opacity: .7; }
    a { color: #7aedff; text-decoration: none; border-bottom: 1px dotted rgba(122,222,255,.5); }
    a:hover { border-bottom-style: solid; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Loading…</h1>
    <p class="muted">If you're not redirected automatically</p>
    <p class="muted"><a id="fallbackLink" href="/">click here</a></p>
  </div>

  <noscript>
    <div class="wrap">
      <p>JavaScript is required. Open the <a id="noscriptLink" href="/">home page</a> and navigate to the token again.</p>
    </div>
  </noscript>

  <script>
    (function () {
      // GitHub Pages serves this file for any unmatched path, at any depth, so
      // the mount point has to be derived rather than assumed.
      var ROUTES = ['token', 'shill', 'leaderboard'];
      function deployBase(segs) {
        // Exact: whatever precedes the first app-route segment is the mount.
        for (var i = 0; i < segs.length; i++) {
          if (ROUTES.indexOf(segs[i]) >= 0) return i ? '/' + segs.slice(0, i).join('/') + '/' : '/';
        }
        // No recognizable route. On a project site the first segment is the repo;
        // anywhere else we're already at the root.
        if (/\.github\.io$/i.test(location.hostname) && segs.length) return '/' + segs[0] + '/';
        return '/';
      }

      var p = location.pathname;
      var base = deployBase(p.split('/').filter(Boolean));
      var route = p.indexOf(base) === 0 ? '/' + p.slice(base.length) : p;

      // Genuine missing files stay a 404 — only app routes get handed to the SPA.
      if (route.indexOf('/assets/') === 0 || /\.[a-z0-9]+$/i.test(route)) return;

      var hashRoute = '#' + route + (location.search || '') + (location.hash || '');
      var target = base + hashRoute;

      document.getElementById('canonical-link').setAttribute('href', base);
      document.getElementById('fallbackLink').setAttribute('href', target);
      var ns = document.getElementById('noscriptLink');
      if (ns) ns.setAttribute('href', base);

      // Primary handoff. The hash above is the fallback for when this is blocked.
      try { sessionStorage.setItem('spa:path', p + location.search + location.hash); } catch (_) {}

      var ua = (navigator.userAgent || '').toLowerCase();
      var isBot = /(bot|crawl|spider|slackbot|discord|twitterbot|facebookexternalhit|linkedinbot|embedly|whatsapp|telegram|vkshare|pinterest|redditbot|preview)/i.test(ua);

      if (!isBot) {
        location.replace(target);
      }
    })();
  </script>
</body>
</html>
